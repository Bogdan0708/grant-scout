name: Credentialed behavioral evaluation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: grant-scout-evaluation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      EVAL_MIN_SCORE: "0.75"
      EVAL_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Require provider credentials
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ] || [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::Evaluation was not run: configure ANTHROPIC_API_KEY and OPENAI_API_KEY first."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run eval
      - name: Upload evaluation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grant-scout-eval-${{ github.sha }}
          path: evals/results/latest.json
          if-no-files-found: warn
